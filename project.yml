name: GarageTime
options:
  bundleIdPrefix: com.henrygawelek
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""           # fill in Xcode for code signing
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES

targets:
  GarageTime:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GarageTime
        excludes:
          - "**/.DS_Store"
    resources:
      - path: GarageTime/Assets.xcassets
      - path: GarageTime/Resources
    info:
      path: GarageTime/Info.plist
      properties:
        CFBundleDisplayName: Garage Time
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: bg.primary
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: "Garage Time uses the camera to scan VINs and capture receipts for service records."
        NSPhotoLibraryUsageDescription: "Garage Time accesses your photo library so you can attach vehicle, part, and receipt photos to records."
        NSPhotoLibraryAddUsageDescription: "Garage Time saves exported PDFs and shared images to your photo library."
        NSMicrophoneUsageDescription: "Garage Time does not record audio; this string satisfies a system check when scanning."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.henrygawelek.garagetime.refresh
        CFBundleURLTypes: []
        UIAppFonts: []
        UIRequiresFullScreen: false
        NSUserActivityTypes: []
    entitlements:
      path: GarageTime/GarageTime.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.henrygawelek.garagetime
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.henrygawelek.garagetime
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrygawelek.garagetime
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GarageTime/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_EMIT_LOC_STRINGS: YES

  GarageTimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GarageTimeTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: GarageTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrygawelek.garagetime.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GarageTime.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GarageTime"

schemes:
  GarageTime:
    build:
      targets:
        GarageTime: all
        GarageTimeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GarageTimeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
